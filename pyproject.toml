[project]
name = "testmind"
version = "0.1.0"
description = "AI-powered software testing platform: repository analysis, test generation, execution, coverage, failure/regression analysis and mutation testing."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "TestMind Contributors" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "alembic>=1.13",
    "asyncpg>=0.29",
    "celery[redis]>=5.4",
    "fastapi>=0.115",
    "packaging>=24",
    "pathspec>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0.1",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "structlog>=24.1",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "bandit>=1.7",
    "celery-types>=0.22",
    "httpx>=0.27",
    "mypy>=1.10",
    "pip-audit>=2.7",
    "pre-commit>=3.7",
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-pyyaml>=6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/testmind"]

# --------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# examples/ holds fixture repositories that TestMind analyses; they are not TestMind's own code.
extend-exclude = ["examples"]
force-exclude = true

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "S", "C4", "DTZ", "T20", "RET", "SIM",
    "PTH", "PT", "ASYNC", "RUF", "ERA", "TID", "PL",
]
ignore = [
    "PLR0913", # FastAPI dependency injection naturally produces many parameters
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S105", "S106"]
"migrations/versions/**" = ["E501"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

# --------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "migrations"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs real PostgreSQL and Redis (see docker-compose.test.yml)",
]
filterwarnings = ["error"]

# --------------------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["testmind"]
branch = true
# SQLAlchemy's asyncio layer runs I/O through greenlets; without this, lines that execute after
# a greenlet switch are reported as not covered.
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]

# --------------------------------------------------------------------------- bandit
[tool.bandit]
exclude_dirs = ["tests", "examples"]
