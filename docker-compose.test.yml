# Throw-away PostgreSQL + Redis for the test suite (`make test-services`).
# Ports are bound to localhost only and differ from the defaults so they never clash with a
# developer's own services. Data lives in tmpfs and disappears on `down`.
name: testmind-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: testmind
      POSTGRES_PASSWORD: testmind
      POSTGRES_DB: testmind_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testmind -d testmind_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
