# Prometheus for the TestMind stack (docs/monitoring.md):
#
#   make up-monitoring    # = docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up
#
# It scrapes the API (with TESTMIND_API_TOKEN, passed as a secret) and the worker on the
# backend network, evaluates docker/prometheus/alerts.yml, and is published on 127.0.0.1 only.
# Alerts are visible at http://127.0.0.1:9090/alerts; routing them to people (Alertmanager,
# e-mail, chat) is left to the deployment.

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${TESTMIND_PROMETHEUS_RETENTION:-15d}
    volumes:
      - ./docker/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    secrets:
      - testmind_api_token
    ports:
      - "127.0.0.1:${TESTMIND_PROMETHEUS_PORT:-9090}:9090"
    # Not read_only: compose writes the environment-sourced secret into the container, which
    # it refuses to do for a read-only one. Every capability is still dropped.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks: [backend]

secrets:
  testmind_api_token:
    environment: TESTMIND_API_TOKEN

volumes:
  prometheus-data:
