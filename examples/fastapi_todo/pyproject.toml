[project]
name = "todo-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
todo-serve = "todo.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
