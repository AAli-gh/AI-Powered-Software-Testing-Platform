# Full TestMind stack: `make up` (or `docker compose up -d --build --wait`).
# Requires a `.env` file — create it with `cp .env.example .env`.
name: testmind

x-app-environment: &app-environment
  TESTMIND_ENV: ${TESTMIND_ENV:-development}
  TESTMIND_LOG_LEVEL: ${TESTMIND_LOG_LEVEL:-INFO}
  TESTMIND_LOG_JSON: ${TESTMIND_LOG_JSON:-true}
  TESTMIND_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?set in .env}:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/${POSTGRES_DB:?set in .env}
  TESTMIND_REDIS_URL: redis://redis:6379/0
  TESTMIND_REPOS_ROOT: /repos
  TESTMIND_LLM_PROVIDER: ${TESTMIND_LLM_PROVIDER:-disabled}
  TESTMIND_AI_FEATURES: ${TESTMIND_AI_FEATURES:-}
  TESTMIND_LLM_MODEL: ${TESTMIND_LLM_MODEL:-claude-opus-5}
  # Read by the Anthropic SDK. Empty = AI features disabled (503 llm_not_configured).
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  # API token (all of /api/ except the signed GitHub webhook) and the limit on changes per
  # client and minute (docs/security.md). Empty token: no authentication (development only).
  TESTMIND_API_TOKEN: ${TESTMIND_API_TOKEN:-}
  TESTMIND_RATE_LIMIT_PER_MINUTE: ${TESTMIND_RATE_LIMIT_PER_MINUTE:-60}
  # GitHub App (docs/github.md). Empty = the GitHub endpoints answer 503 github_not_configured.
  TESTMIND_GITHUB_APP_ID: ${TESTMIND_GITHUB_APP_ID:-}
  TESTMIND_GITHUB_PRIVATE_KEY: ${TESTMIND_GITHUB_PRIVATE_KEY:-}
  TESTMIND_GITHUB_WEBHOOK_SECRET: ${TESTMIND_GITHUB_WEBHOOK_SECRET:-}
  TESTMIND_GITHUB_ALLOWED_OWNERS: ${TESTMIND_GITHUB_ALLOWED_OWNERS:-}
  TESTMIND_GITHUB_IMPORTS_ROOT: /imports
  TESTMIND_PUBLIC_URL: ${TESTMIND_PUBLIC_URL:-}
  TESTMIND_GITHUB_PRIVATE_KEY_FILE: ${TESTMIND_GITHUB_PRIVATE_KEY_FILE:-}
  TESTMIND_GITHUB_API_URL: ${TESTMIND_GITHUB_API_URL:-}
  TESTMIND_GITHUB_CHECK_NAME: ${TESTMIND_GITHUB_CHECK_NAME:-}
  TESTMIND_GITHUB_MAX_ARCHIVE_MB: ${TESTMIND_GITHUB_MAX_ARCHIVE_MB:-}
  # Limits (.env.example). Empty means the default in core/config.py.
  TESTMIND_CELERY_TASK_TIME_LIMIT_SECONDS: ${TESTMIND_CELERY_TASK_TIME_LIMIT_SECONDS:-}
  TESTMIND_SANDBOX_TIMEOUT_SECONDS: ${TESTMIND_SANDBOX_TIMEOUT_SECONDS:-}
  TESTMIND_SANDBOX_MEMORY: ${TESTMIND_SANDBOX_MEMORY:-}
  TESTMIND_SANDBOX_CPUS: ${TESTMIND_SANDBOX_CPUS:-}
  TESTMIND_GENERATION_MAX_ITERATIONS: ${TESTMIND_GENERATION_MAX_ITERATIONS:-}
  TESTMIND_GENERATION_MAX_TARGETS: ${TESTMIND_GENERATION_MAX_TARGETS:-}
  TESTMIND_COVERAGE_THRESHOLD: ${TESTMIND_COVERAGE_THRESHOLD:-}
  TESTMIND_FAILURE_ANALYSIS_MAX_GROUPS: ${TESTMIND_FAILURE_ANALYSIS_MAX_GROUPS:-}
  TESTMIND_FAULT_LOCALIZATION_RANKER: ${TESTMIND_FAULT_LOCALIZATION_RANKER:-}
  TESTMIND_FAULT_LOCALIZATION_MODEL: ${TESTMIND_FAULT_LOCALIZATION_MODEL:-}
  TESTMIND_MUTATION_MAX_MUTANTS: ${TESTMIND_MUTATION_MAX_MUTANTS:-}
  TESTMIND_MUTATION_MUTANT_TIMEOUT_SECONDS: ${TESTMIND_MUTATION_MUTANT_TIMEOUT_SECONDS:-}
  TESTMIND_MUTATION_JOB_TIMEOUT_SECONDS: ${TESTMIND_MUTATION_JOB_TIMEOUT_SECONDS:-}
  TESTMIND_MUTATION_MAX_SUGGESTIONS: ${TESTMIND_MUTATION_MAX_SUGGESTIONS:-}
  TESTMIND_API_MAX_SUGGESTIONS: ${TESTMIND_API_MAX_SUGGESTIONS:-}

x-app-security: &app-security
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [backend]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [backend]

  # One-shot: applies database migrations, then exits. The API waits for it to succeed.
  migrate:
    build:
      context: .
      target: api
    image: testmind-api:local
    command: ["alembic", "upgrade", "head"]
    environment: *app-environment
    <<: *app-security
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]

  api:
    image: testmind-api:local
    environment: *app-environment
    <<: *app-security
    volumes:
      - ${TESTMIND_HOST_REPOS_DIR:-./examples}:/repos:ro
      - github-imports:/imports:ro
    ports:
      - "127.0.0.1:${TESTMIND_API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [backend]

  # The dashboard: static files and a same-origin proxy to the API (nginx, unprivileged).
  web:
    build:
      context: ./web
      dockerfile: ../docker/web.Dockerfile
    image: testmind-web:local
    <<: *app-security
    ports:
      - "127.0.0.1:${TESTMIND_WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks: [backend]

  worker:
    build:
      context: .
      target: worker
    image: testmind-worker:local
    environment:
      <<: *app-environment
      # Prometheus metrics of the worker (docs/monitoring.md), on the backend network only.
      TESTMIND_WORKER_METRICS_PORT: "9100"
    <<: *app-security
    volumes:
      - ${TESTMIND_HOST_REPOS_DIR:-./examples}:/repos:ro
      # Imported GitHub repositories: written by the worker only.
      - github-imports:/imports
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [backend]

networks:
  backend:

volumes:
  postgres-data:
  redis-data:
  github-imports:
