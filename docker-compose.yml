# Full TestMind stack: `make up` (or `docker compose up -d --build --wait`).
# Requires a `.env` file — create it with `cp .env.example .env`.
name: testmind

x-app-environment: &app-environment
  TESTMIND_ENV: ${TESTMIND_ENV:-development}
  TESTMIND_LOG_LEVEL: ${TESTMIND_LOG_LEVEL:-INFO}
  TESTMIND_LOG_JSON: ${TESTMIND_LOG_JSON:-true}
  TESTMIND_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?set in .env}:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/${POSTGRES_DB:?set in .env}
  TESTMIND_REDIS_URL: redis://redis:6379/0
  TESTMIND_REPOS_ROOT: /repos
  TESTMIND_LLM_PROVIDER: ${TESTMIND_LLM_PROVIDER:-anthropic}
  TESTMIND_LLM_MODEL: ${TESTMIND_LLM_MODEL:-claude-opus-5}
  # Read by the Anthropic SDK. Empty = AI features disabled (503 llm_not_configured).
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

x-app-security: &app-security
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [backend]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [backend]

  # One-shot: applies database migrations, then exits. The API waits for it to succeed.
  migrate:
    build:
      context: .
      target: api
    image: testmind-api:local
    command: ["alembic", "upgrade", "head"]
    environment: *app-environment
    <<: *app-security
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]

  api:
    image: testmind-api:local
    environment: *app-environment
    <<: *app-security
    volumes:
      - ${TESTMIND_HOST_REPOS_DIR:-./examples}:/repos:ro
    ports:
      - "127.0.0.1:${TESTMIND_API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [backend]

  worker:
    build:
      context: .
      target: worker
    image: testmind-worker:local
    environment: *app-environment
    <<: *app-security
    volumes:
      - ${TESTMIND_HOST_REPOS_DIR:-./examples}:/repos:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [backend]

networks:
  backend:

volumes:
  postgres-data:
  redis-data:
