# Serves the dashboard and proxies the API (the compose service "api") on the same origin.
# Runs as an unprivileged user on 8080 with a read-only filesystem.
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    # GitHub webhook deliveries are at most 5 MB (checked again by the API).
    client_max_body_size 6m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The API, its probes and its reference documentation.
    location ~ ^/(api/|health$|ready$|docs|redoc|openapi\.json$) {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Content-hashed bundles: cached for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # The single-page application: every other path is a client-side route.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri /index.html;
    }
}
