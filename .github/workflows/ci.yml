name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.8.17"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run mypy

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testmind
          POSTGRES_PASSWORD: testmind
          POSTGRES_DB: testmind_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U testmind -d testmind_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TESTMIND_TEST_DATABASE_URL: postgresql+asyncpg://testmind:testmind@localhost:5432/testmind_test
      TESTMIND_TEST_REDIS_URL: redis://localhost:6379/15
      TESTMIND_REQUIRE_BROWSER_IMAGE: "1" # the browser test must run here, never be skipped
      TESTMIND_REQUIRE_PYTHON_IMAGES: "1" # so must the sandbox of every Python version
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - name: Install Chromium for Playwright (the web scanner's browser tests)
        run: uv run playwright install chromium
      - name: Build the sandbox images, one per Python version (run tests in isolation)
        run: uv run python scripts/sandbox_images.py
      - name: Build the browser sandbox image (headless Chromium for Playwright tests)
        run: docker build -f docker/browser.Dockerfile -t testmind-sandbox-browser:local .
      - name: Unit tests
        run: >-
          uv run pytest -m "not integration and not sandbox and not browser"
          --cov --cov-report= --cov-fail-under=0
      - name: Integration, API, sandbox and browser tests (coverage gate over the whole suite)
        env:
          TESTMIND_REQUIRE_BROWSER: "1" # the web-scan test must run here, never be skipped
        run: >-
          uv run pytest -m "integration or sandbox or browser"
          --cov --cov-append --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always() && matrix.python == '3.12'
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # gitleaks scans the full history
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - name: Static security analysis (bandit) + dependency audit (pip-audit)
        run: make security
      - name: Secret scanning (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 \
            git /repo --redact --verbose

  web:
    name: Dashboard (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: The committed OpenAPI schema and TypeScript types match the API's code
        run: |
          uv run --project .. python ../scripts/export_openapi.py --check
          npm run openapi
          git diff --exit-code -- src/api/schema.ts
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - name: Component tests (coverage gate in vite.config.ts)
        run: npm run test:coverage
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker build + smoke test (sandboxed worker, monitoring)
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, web]
    env:
      # The stack whose containerised worker runs tests through the sandbox proxy, with
      # Prometheus scraping the API and the worker.
      COMPOSE_FILE: docker-compose.yml:docker-compose.sandbox.yml:docker-compose.monitoring.yml
      TESTMIND_SANDBOX_DIR: ${{ github.workspace }}/.sandbox
      TESTMIND_HOST_REPOS_DIR: ${{ github.workspace }}/examples
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6 # scripts/sandbox_images.py reads the Python version table
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - name: Prepare environment file and sandbox directory
        run: |
          cp .env.example .env
          mkdir -p "$TESTMIND_SANDBOX_DIR"
          # A fresh API token per run, so the smoke and browser tests go through authentication.
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          echo "TESTMIND_API_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Prometheus configuration and alert rule unit tests (promtool)
        run: make monitoring-check
      - name: Build the sandbox images (on the host daemon, used through the proxy)
        run: uv run python scripts/sandbox_images.py
      - name: Build images
        run: docker compose build
      - name: Start stack
        run: docker compose up -d --wait --wait-timeout 180
      - name: Smoke test (tests must really run in the sandbox)
        env:
          TESTMIND_EXPECT_SANDBOX: "1"
        run: ./scripts/smoke_test.sh
      - name: Monitoring (Prometheus scrapes both targets, the smoke test's jobs are recorded)
        env:
          TESTMIND_EXPECT_SANDBOX: "1"
        run: ./scripts/monitoring_check.sh
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Dashboard end-to-end tests (real browser, through the web container)
        working-directory: web
        env:
          TESTMIND_WEB_URL: http://127.0.0.1:8080
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          if-no-files-found: ignore
      - name: Container logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down -v
